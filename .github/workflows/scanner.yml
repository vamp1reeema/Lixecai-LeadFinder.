name: LeadFinder

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: "Отправить одно тестовое сообщение в Telegram"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore scanner state
        uses: actions/cache@v4
        with:
          path: state.sqlite
          key: leadfinder-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            leadfinder-state-${{ github.ref_name }}-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_CHAT_ID: ${{ secrets.BOT_CHAT_ID }}
          SEND_TEST: ${{ inputs.send_test || false }}
        run: python main.py
